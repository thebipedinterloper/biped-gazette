<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>The Biped Gazette</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Georgia, serif; }
    #ar { position: fixed; inset: 0; touch-action: none; }
    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fff; color: #000; text-align: center; cursor: pointer;
    }
    #start h1 { font-size: 28px; margin: 0 0 12px 0; letter-spacing: 1px; }
    #start p  { font-size: 16px; margin: 0; }
    #status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      background: rgba(255,255,255,0.9); color: #000; padding: 6px 12px; border-radius: 4px;
      font-size: 12px; line-height: 1.4; display: none; max-width: 92%; text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="start">
    <h1>THE BIPED GAZETTE</h1>
    <p>Tap to begin</p>
  </div>
  <div id="status">Looking for the map…</div>
  <div id="ar"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // ============================================================
    // TEST SWITCHES AND TUNING
    // ============================================================
    // Where the map is centred:
    //   'gps'           = the reader's position (Point Nemo if location fails)
    //   'nearFirstTree' = desk test: 20 m south and 10 m west of the first tree in Firestore
    const CENTER_MODE = 'gps';

    const SHOW_DEBUG_OUTLINE = false;  // green outline of the blank area
    const SHOW_STATUS        = true;   // the information line at the top of the screen

    // Fingertip on paper
    const HOLD_MS            = 800;    // how long a fingertip must rest to select or grab (ms)
    const HOLD_STEADINESS    = 0.8;    // share of readings during the hold that must see the finger
    const SLIDER_COOLDOWN_MS = 800;    // after letting go, the bar ignores the paper for this long

    // Tracking steadiness
    const TRACK_FILTER_MIN_CF = 0.0001;  // MindAR: lower = less jitter
    const TRACK_FILTER_BETA   = 10;      // MindAR: higher = less lag
    const TRACK_WARMUP_FRAMES = 5;       // frames before the page counts as found
    const TRACK_MISS_FRAMES   = 15;      // frames without the page before it counts as lost
    const DISPLAY_SMOOTHING   = 0.35;    // 0.1 = very steady but soft, 1 = no extra smoothing

    // ============================================================
    // FIREBASE (your web app config)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA7T_RzFr779vvo4TWR4fNrtA20D-CAo98",
      authDomain: "arvore-56897.firebaseapp.com",
      projectId: "arvore-56897",
      storageBucket: "arvore-56897.firebasestorage.app",
      messagingSenderId: "20525579847",
      appId: "1:20525579847:web:9e8ac502d16b1ed4ddfb62"
    };
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    // ============================================================
    // PAPER LAYOUT (from InDesign, in cm, measured from the page's top-left corner)
    // ============================================================
    const PAGE_WIDTH_CM  = 21.0;   // A4 portrait
    const PAGE_HEIGHT_CM = 29.7;

    const BLANK_AREA_CM = { left: 3.24, top: 3.11, right: 17.74, bottom: 26.61 };
    const BLANK_CENTER_CM = {
      x: (BLANK_AREA_CM.left + BLANK_AREA_CM.right) / 2,
      y: (BLANK_AREA_CM.top + BLANK_AREA_CM.bottom) / 2
    };
    const BLANK_WIDTH_CM = BLANK_AREA_CM.right - BLANK_AREA_CM.left;     // 14.5 cm

    // Scale slider: thin white line in the LEFT side of the thick bar (bottom = closest, top = world)
    const SLIDER_CM = { x: 3.00, bottomY: 26.87, topY: 2.80 };
    const SLIDER_LENGTH_CM = SLIDER_CM.bottomY - SLIDER_CM.topY;         // 24.07 cm
    const SLIDER_READ_X_CM = 2.75;     // the eye reads the black stretch just left of the white line
    const SLIDER_TOUCH_CM  = 1.5;      // screen backup: a touch within 1.5 cm of the line grabs it

    // Edition circles: one row under the word EDITION
    const EDITION_ROW_CM = { centerX: 10.5, centerY: 29.15 };
    const EDITION_CIRCLE_CM = 1.0;
    const EDITION_GAP_CM    = 0.4;
    const EDITION_LINE_CM   = 0.035;   // about 1 pt
    const EDITION_TOUCH_CM  = 0.9;     // screen backup: a tap within 9 mm of a circle counts

    // Tree dots and line detection
    const DOT_DIAMETER_CM      = 0.3;  // 3 mm, always the same on paper
    const LINE_CATCH_RADIUS_CM = 0.5;  // a line counts if it passes within 5 mm of the tree's spot
    const LINE_CONFIRM_TICKS   = 5;    // the mark must be seen 5 reads in a row (half a second)

    // The eye
    const EYE_TICK_MS    = 100;
    const EYE_WIDTH_PX   = 960;
    const COVER_DISTANCE = 45;         // white paper: how different a point must look to count as covered
    const BAR_BRIGHTER   = 45;         // black bar: how much brighter a point must look (a fingertip on ink)

    const GREEN = 0x00ff00;

    function cmToPage(xCm, yCm) {
      return { x: (xCm - PAGE_WIDTH_CM / 2) / PAGE_WIDTH_CM, y: (PAGE_HEIGHT_CM / 2 - yCm) / PAGE_WIDTH_CM };
    }
    function pageToCm(x, y) {
      return { x: x * PAGE_WIDTH_CM + PAGE_WIDTH_CM / 2, y: PAGE_HEIGHT_CM / 2 - y * PAGE_WIDTH_CM };
    }
    function cmToUnits(cm) { return cm / PAGE_WIDTH_CM; }

    // ============================================================
    // MAP: Equal Earth projection, centred on the reader, north up
    // ============================================================
    const EARTH_RADIUS_M = 6371008.8;
    const DEG = Math.PI / 180;
    const POINT_NEMO = { lat: -48.8767, lon: -123.3933 };

    const EE_A1 = 1.340264, EE_A2 = -0.081106, EE_A3 = 0.000893, EE_A4 = 0.003796;
    const EE_M = Math.sqrt(3) / 2;

    function equalEarth(lambda, phi) {
      const t = Math.asin(EE_M * Math.sin(phi));
      const t2 = t * t, t6 = t2 * t2 * t2;
      const x = (2 * Math.sqrt(3) * lambda * Math.cos(t)) /
                (3 * (9 * EE_A4 * t6 * t2 + 7 * EE_A3 * t6 + 3 * EE_A2 * t2 + EE_A1));
      const y = t * (EE_A1 + EE_A2 * t2 + t6 * (EE_A3 + EE_A4 * t2));
      return { x, y };
    }
    function wrapLongitude(deg) { return ((deg + 540) % 360) - 180; }

    const METERS_PER_CM_CLOSEST = 100 / SLIDER_LENGTH_CM;
    const WORLD_WIDTH_M = 2 * equalEarth(Math.PI, 0).x * EARTH_RADIUS_M;
    const METERS_PER_CM_WORLD = WORLD_WIDTH_M / BLANK_WIDTH_CM;

    let scaleT = 0;   // 0 = closest (bottom of the line), 1 = whole world (top)
    function metersPerCm() {
      return METERS_PER_CM_CLOSEST * Math.pow(METERS_PER_CM_WORLD / METERS_PER_CM_CLOSEST, scaleT);
    }

    let center = { lat: POINT_NEMO.lat, lon: POINT_NEMO.lon, source: 'Point Nemo' };

    function geoToPaperCm(lat, lon) {
      const centerY = equalEarth(0, center.lat * DEG).y;
      const p = equalEarth(wrapLongitude(lon - center.lon) * DEG, lat * DEG);
      const mpc = metersPerCm();
      return {
        x: BLANK_CENTER_CM.x + (p.x * EARTH_RADIUS_M) / mpc,
        y: BLANK_CENTER_CM.y - ((p.y - centerY) * EARTH_RADIUS_M) / mpc
      };
    }
    function isInsideBlankArea(p) {
      return p.x >= BLANK_AREA_CM.left && p.x <= BLANK_AREA_CM.right &&
             p.y >= BLANK_AREA_CM.top  && p.y <= BLANK_AREA_CM.bottom;
    }
    function scaleLabel() {
      const meters = metersPerCm() * SLIDER_LENGTH_CM;
      return meters < 1000 ? 'line = ' + Math.round(meters) + ' m'
                           : 'line = ' + Math.round(meters / 1000).toLocaleString() + ' km';
    }

    // ============================================================
    // DATA: curated trees from Firestore
    // ============================================================
    let trees = [];
    let editions = [];
    let selectedEdition = null;
    const foundTrees = new Set();
    const lineStreak = new Map();

    async function loadTrees() {
      const snapshot = await getDocs(collection(db, 'curatedTree'));
      const list = [];
      snapshot.forEach((doc) => {
        const d = doc.data();
        if (d.edition === undefined || d.edition === null) return;
        const edition = Number(d.edition);
        if (Number.isNaN(edition)) return;
        list.push({ id: doc.id, title: doc.id, latitude: Number(d.latitude), longitude: Number(d.longitude), edition, data: d });
      });
      trees = list;
      editions = [...new Set(list.map(t => t.edition))].sort((a, b) => a - b);
    }
    const treesReady = loadTrees();

    function treesOnPage() {
      if (selectedEdition === null) return [];
      return trees
        .filter(t => t.edition === selectedEdition)
        .map(t => ({ tree: t, paper: geoToPaperCm(t.latitude, t.longitude) }))
        .filter(o => isInsideBlankArea(o.paper));
    }

    // ============================================================
    // STATUS LINE
    // ============================================================
    const statusEl = document.getElementById('status');
    let mapFound = false;
    let dataProblem = '';

    function refreshStatus() {
      if (!SHOW_STATUS) { statusEl.style.display = 'none'; return; }
      let text = mapFound ? 'Map found' : 'Looking for the map…';
      if (dataProblem) {
        text += ' · ' + dataProblem;
      } else if (selectedEdition === null) {
        text += ' · Rest a fingertip on an edition number';
      } else {
        const onPage = treesOnPage();
        const foundOnPage = onPage.filter(o => foundTrees.has(o.tree.id)).length;
        text += ' · Edition ' + selectedEdition + ' · ' + onPage.length + ' on the page, ' + foundOnPage + ' found · ' +
                scaleLabel() + ' · centre: ' + center.source;
      }
      if (slider.grabbed) text += ' · sliding…';
      statusEl.textContent = text;
    }

    // ============================================================
    // LOCATION
    // ============================================================
    function getGpsPosition() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    // ============================================================
    // DRAWING HELPERS
    // ============================================================
    function hashString(text) {
      let h = 2166136261;
      for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function seededRandom(seed) {
      let s = seed || 1;
      return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
    }

    function makeBlob(seedText) {
      const random = seededRandom(hashString(seedText));
      const pointCount = 9;
      const radius = cmToUnits(DOT_DIAMETER_CM) / 2;
      const points = [];
      for (let i = 0; i < pointCount; i++) {
        const angle = (i / pointCount) * Math.PI * 2 + (random() - 0.5) * 0.45;
        const r = radius * (0.78 + random() * 0.4);
        points.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
      }
      const mid = (a, b) => new THREE.Vector2((a.x + b.x) / 2, (a.y + b.y) / 2);
      const shape = new THREE.Shape();
      const start = mid(points[pointCount - 1], points[0]);
      shape.moveTo(start.x, start.y);
      for (let i = 0; i < pointCount; i++) {
        const p = points[i];
        const m = mid(p, points[(i + 1) % pointCount]);
        shape.quadraticCurveTo(p.x, p.y, m.x, m.y);
      }
      return new THREE.Mesh(new THREE.ShapeGeometry(shape, 12), new THREE.MeshBasicMaterial({ color: GREEN }));
    }

    function makeEditionCircle(number) {
      const px = 256;
      const canvas = document.createElement('canvas');
      canvas.width = px; canvas.height = px;
      const g = canvas.getContext('2d');
      const lineWidth = Math.max(2, px * (EDITION_LINE_CM / EDITION_CIRCLE_CM));
      g.strokeStyle = '#000000';
      g.lineWidth = lineWidth;
      g.beginPath();
      g.arc(px / 2, px / 2, px / 2 - lineWidth / 2 - 2, 0, Math.PI * 2);
      g.stroke();
      g.fillStyle = '#000000';
      g.font = '120px Georgia, serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(String(number), px / 2, px / 2 + 8);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const size = cmToUnits(EDITION_CIRCLE_CM);
      return new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
    }

    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      }
    }

    // ============================================================
    // EDITION CIRCLES
    // ============================================================
    let editionExpanded = true;
    let editionGroup, editionFills = [];

    function editionListPositions() {
      const pitch = EDITION_CIRCLE_CM + EDITION_GAP_CM;
      const rowWidth = editions.length * EDITION_CIRCLE_CM + Math.max(0, editions.length - 1) * EDITION_GAP_CM;
      const firstX = EDITION_ROW_CM.centerX - rowWidth / 2 + EDITION_CIRCLE_CM / 2;
      return editions.map((ed, i) => ({ edition: ed, x: firstX + i * pitch, y: EDITION_ROW_CM.centerY }));
    }
    function visibleEditionCircles() {
      if (editionExpanded || selectedEdition === null) return editionListPositions();
      return [{ edition: selectedEdition, x: EDITION_ROW_CM.centerX, y: EDITION_ROW_CM.centerY }];
    }

    function buildEditionRow() {
      clearGroup(editionGroup);
      editionFills = [];
      visibleEditionCircles().forEach((c) => {
        const p = cmToPage(c.x, c.y);
        const fill = new THREE.Mesh(
          new THREE.CircleGeometry(cmToUnits(EDITION_CIRCLE_CM) / 2 * 0.97, 40),
          new THREE.MeshBasicMaterial({ color: GREEN, transparent: true, opacity: 0 })
        );
        fill.position.set(p.x, p.y, 0.0015);
        editionGroup.add(fill);
        editionFills.push({ mesh: fill, edition: c.edition });

        const circle = makeEditionCircle(c.edition);
        circle.position.set(p.x, p.y, 0.002);
        editionGroup.add(circle);
      });
      paintEditionFills(null, 0);
    }
    function paintEditionFills(holdIndex, progress) {
      editionFills.forEach((f, i) => {
        let opacity = (f.edition === selectedEdition) ? 1 : 0;
        if (i === holdIndex && f.edition !== selectedEdition) opacity = Math.min(progress, 1);
        f.mesh.material.opacity = opacity;
      });
    }

    // What happens when an edition circle is chosen (by finger or by screen tap)
    function chooseEditionCircle(c) {
      if (editionExpanded) { selectedEdition = c.edition; editionExpanded = false; }
      else { editionExpanded = true; }
      buildEditionRow();
      buildTreeDots();
      refreshStatus();
    }

    // ============================================================
    // SCALE TICK and TREE DOTS
    // ============================================================
    let tickMesh, holdMarker, treeGroup;
    let builtScaleT = null;

    const slider = {
      grabbed: false, viaScreen: false,
      holdY: null, holdStart: 0, holdReads: 0, holdHits: 0,
      lastY: null, lastSeen: 0, cooldownUntil: 0
    };

    function placeTick() {
      const yCm = SLIDER_CM.bottomY + (SLIDER_CM.topY - SLIDER_CM.bottomY) * scaleT;
      const p = cmToPage(SLIDER_CM.x, yCm);
      tickMesh.position.set(p.x, p.y, 0.002);
      tickMesh.scale.set(1, slider.grabbed ? 2.2 : 1, 1);
    }
    function yToScaleT(yCm) {
      return Math.min(1, Math.max(0, (SLIDER_CM.bottomY - yCm) / SLIDER_LENGTH_CM));
    }
    function setScaleT(t) {
      scaleT = t;
      placeTick();
      if (builtScaleT === null || Math.abs(scaleT - builtScaleT) > 0.002) buildTreeDots();
    }

    function buildTreeDots() {
      clearGroup(treeGroup);
      treesOnPage().forEach(({ tree, paper }) => {
        if (!foundTrees.has(tree.id)) return;
        const blob = makeBlob(tree.id);
        const p = cmToPage(paper.x, paper.y);
        blob.position.set(p.x, p.y, 0.003);
        treeGroup.add(blob);
      });
      builtScaleT = scaleT;
    }

    // ============================================================
    // THE EYE: reading the camera image
    // ============================================================
    const eyeCanvas = document.createElement('canvas');
    const eyeCtx = eyeCanvas.getContext('2d', { willReadFrequently: true });
    let eyePixels = null;
    const tmpVec = new THREE.Vector3();
    let view = null;

    function captureFrame(video) {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return false;
      const w = Math.min(EYE_WIDTH_PX, vw);
      const h = Math.round(vh * (w / vw));
      if (eyeCanvas.width !== w || eyeCanvas.height !== h) { eyeCanvas.width = w; eyeCanvas.height = h; }
      eyeCtx.drawImage(video, 0, 0, w, h);
      eyePixels = eyeCtx.getImageData(0, 0, w, h).data;
      return true;
    }

    // Uses the exact tracked position (not the smoothed display), for precise reading
    function paperToEyePixel(xCm, yCm) {
      const p = cmToPage(xCm, yCm);
      tmpVec.set(p.x, p.y, 0).applyMatrix4(view.anchorGroup.matrixWorld).project(view.camera);
      const sx = view.canvasRect.left + (tmpVec.x + 1) / 2 * view.canvasRect.width;
      const sy = view.canvasRect.top + (1 - tmpVec.y) / 2 * view.canvasRect.height;
      return {
        x: (sx - view.videoRect.left) / view.videoRect.width * eyeCanvas.width,
        y: (sy - view.videoRect.top) / view.videoRect.height * eyeCanvas.height
      };
    }

    function pixelLum(x, y) {
      const i = (y * eyeCanvas.width + x) * 4;
      return 0.299 * eyePixels[i] + 0.587 * eyePixels[i + 1] + 0.114 * eyePixels[i + 2];
    }
    function readColor(px, py) {
      px = Math.round(px); py = Math.round(py);
      const w = eyeCanvas.width, h = eyeCanvas.height;
      if (px < 1 || py < 1 || px >= w - 1 || py >= h - 1) return null;
      let r = 0, g = 0, b = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const i = ((py + dy) * w + (px + dx)) * 4;
          r += eyePixels[i]; g += eyePixels[i + 1]; b += eyePixels[i + 2];
        }
      }
      return [r / 9, g / 9, b / 9];
    }
    const lum = (c) => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];

    // ---------- Reading points (edition circles and slider) ----------
    // kind 'paper' = white paper: covered when clearly different
    // kind 'bar'   = black ink:   covered only when clearly BRIGHTER (a fingertip on the bar)
    function makeSample(xCm, yCm, kind) { return { xCm, yCm, kind, base: null, covered: false }; }

    const CIRCLE_INNER = [[0,0],[0.22,0],[-0.22,0],[0,0.22],[0,-0.22],[0.16,0.16],[-0.16,0.16],[0.16,-0.16],[-0.16,-0.16]];
    const CIRCLE_OUTER_RADIUS = 0.95;
    const CIRCLE_OUTER_ANGLES = [0, 45, 90, 135, 180];
    const circleSampleCache = new Map();
    function circleSamples(xCm, yCm) {
      const key = xCm.toFixed(2) + ',' + yCm.toFixed(2);
      if (!circleSampleCache.has(key)) {
        circleSampleCache.set(key, {
          inner: CIRCLE_INNER.map(([dx, dy]) => makeSample(xCm + dx, yCm - dy, 'paper')),
          outer: CIRCLE_OUTER_ANGLES.map((a) => makeSample(
            xCm + CIRCLE_OUTER_RADIUS * Math.cos(a * DEG), yCm - CIRCLE_OUTER_RADIUS * Math.sin(a * DEG), 'paper'))
        });
      }
      return circleSampleCache.get(key);
    }

    const SLIDER_STEP_CM = 0.25;
    const sliderSamples = [];
    for (let y = SLIDER_CM.topY; y <= SLIDER_CM.bottomY + 0.001; y += SLIDER_STEP_CM) {
      sliderSamples.push(makeSample(SLIDER_READ_X_CM, y, 'bar'));
    }

    function allSamples() {
      const list = [...sliderSamples];
      const positions = editionListPositions().concat([{ x: EDITION_ROW_CM.centerX, y: EDITION_ROW_CM.centerY }]);
      positions.forEach((pos) => {
        const s = circleSamples(pos.x, pos.y);
        list.push(...s.inner, ...s.outer);
      });
      return list;
    }

    function readSamples(samples) {
      const current = samples.map((s) => {
        const px = paperToEyePixel(s.xCm, s.yCm);
        return readColor(px.x, px.y);
      });
      // overall brightness change (camera auto-exposure), measured on white paper points
      const ratios = [];
      samples.forEach((s, i) => {
        if (s.kind === 'paper' && s.base && current[i] && lum(s.base) > 40) ratios.push(lum(current[i]) / lum(s.base));
      });
      ratios.sort((a, b) => a - b);
      const ratio = ratios.length ? ratios[Math.floor(ratios.length / 2)] : 1;

      samples.forEach((s, i) => {
        const c = current[i];
        if (!c) { s.covered = false; return; }
        if (!s.base) { s.base = c.slice(); s.covered = false; return; }
        const expected = s.base.map(v => v * ratio);
        if (s.kind === 'bar') {
          s.covered = lum(c) - lum(expected) > BAR_BRIGHTER;
        } else {
          s.covered = Math.hypot(c[0] - expected[0], c[1] - expected[1], c[2] - expected[2]) > COVER_DISTANCE;
        }
        if (!s.covered) for (let k = 0; k < 3; k++) s.base[k] = s.base[k] * 0.95 + (c[k] / ratio) * 0.05;
      });
    }

    // ============================================================
    // LINE DETECTION
    // ============================================================
    function lineAtSpot(paper) {
      const c = paperToEyePixel(paper.x, paper.y);
      const e = paperToEyePixel(paper.x + LINE_CATCH_RADIUS_CM, paper.y);
      const r = Math.hypot(e.x - c.x, e.y - c.y);
      if (r < 2) return false;
      const w = eyeCanvas.width, h = eyeCanvas.height;
      const x0 = Math.floor(c.x - r), x1 = Math.ceil(c.x + r);
      const y0 = Math.floor(c.y - r), y1 = Math.ceil(c.y + r);
      if (x0 < 0 || y0 < 0 || x1 >= w || y1 >= h) return false;

      const values = [];
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const dx = x - c.x, dy = y - c.y;
          if (dx * dx + dy * dy <= r * r) values.push(pixelLum(x, y));
        }
      }
      if (values.length < 12) return false;
      const sorted = values.slice().sort((a, b) => a - b);
      const paperWhite = sorted[Math.floor(sorted.length * 0.8)];
      if (paperWhite < 70) return false;
      const inkLimit = paperWhite * 0.62;
      const ink = values.filter(v => v < inkLimit).length;
      const inkFraction = ink / values.length;
      return ink >= Math.max(3, values.length * 0.01) && inkFraction <= 0.35;
    }

    function updateLines() {
      let changed = false;
      treesOnPage().forEach(({ tree, paper }) => {
        if (foundTrees.has(tree.id)) return;
        if (lineAtSpot(paper)) {
          const n = (lineStreak.get(tree.id) || 0) + 1;
          lineStreak.set(tree.id, n);
          if (n >= LINE_CONFIRM_TICKS) { foundTrees.add(tree.id); changed = true; }
        } else {
          lineStreak.set(tree.id, 0);
        }
      });
      if (changed) { buildTreeDots(); refreshStatus(); }
    }

    // ============================================================
    // FINGERTIP: edition circles
    // ============================================================
    const editionHold = { index: null, start: 0, reads: 0, hits: 0, waitRelease: false, lastSeen: 0 };

    function fingerOnCircle(c) {
      const s = circleSamples(c.x, c.y);
      const innerCovered = s.inner.filter(p => p.covered).length;
      const outerCovered = s.outer.filter(p => p.covered).length;
      return innerCovered >= 6 && outerCovered <= 3;      // fingertip yes, arm/hand no
    }

    function updateEditions(now) {
      if (!editions.length) return;
      const circles = visibleEditionCircles();
      let fingerIndex = null;
      circles.forEach((c, i) => { if (fingerIndex === null && fingerOnCircle(c)) fingerIndex = i; });

      if (fingerIndex !== null) editionHold.lastSeen = now;

      // Nothing there for a moment: reset
      if (fingerIndex === null && now - editionHold.lastSeen > 250) {
        editionHold.index = null;
        editionHold.waitRelease = false;
        paintEditionFills(null, 0);
        return;
      }
      if (editionHold.waitRelease) { paintEditionFills(null, 0); return; }

      // A new circle is being held
      if (fingerIndex !== null && fingerIndex !== editionHold.index) {
        editionHold.index = fingerIndex;
        editionHold.start = now;
        editionHold.reads = 0;
        editionHold.hits = 0;
      }
      if (editionHold.index === null) return;

      editionHold.reads++;
      if (fingerIndex === editionHold.index) editionHold.hits++;
      const progress = (now - editionHold.start) / HOLD_MS;
      paintEditionFills(editionHold.index, progress);

      if (progress >= 1) {
        if (editionHold.hits / Math.max(1, editionHold.reads) >= HOLD_STEADINESS) {
          chooseEditionCircle(circles[editionHold.index]);
          editionHold.waitRelease = true;
        } else {
          editionHold.index = null;      // not steady enough (flicker): start over
        }
      }
    }

    // ============================================================
    // FINGERTIP: scale slider
    // ============================================================
    function findFingerOnSlider() {
      const runs = [];
      let runStart = null, gap = 0;
      sliderSamples.forEach((s, i) => {
        if (s.covered) { if (runStart === null) runStart = i; gap = 0; }
        else if (runStart !== null) {
          gap++;
          if (gap > 1) { runs.push([runStart, i - gap]); runStart = null; gap = 0; }
        }
      });
      if (runStart !== null) runs.push([runStart, sliderSamples.length - 1 - gap]);

      let finger = null;
      for (const [a, b] of runs) {
        const lengthCm = (b - a + 1) * SLIDER_STEP_CM;
        if (lengthCm > 4.5) return null;                       // arm or hand: ignore
        if (lengthCm >= 0.75 && lengthCm <= 3.0) {
          if (finger !== null) return null;                    // two separate "fingers" = noise: ignore
          finger = (sliderSamples[a].yCm + sliderSamples[b].yCm) / 2;
        }
      }
      return finger;
    }

    function updateSlider(now) {
      if (slider.viaScreen) return;                            // a screen drag is in charge
      const fingerY = (now < slider.cooldownUntil) ? null : findFingerOnSlider();
      if (fingerY !== null) slider.lastSeen = now;

      if (slider.grabbed) {
        if (fingerY !== null) {
          if (slider.lastY === null || Math.abs(fingerY - slider.lastY) < 3.0) {   // ignore sudden jumps
            slider.lastY = fingerY;
            setScaleT(scaleT + (yToScaleT(fingerY) - scaleT) * 0.5);
          }
        } else if (now - slider.lastSeen > 600) {
          slider.grabbed = false;                              // finger lifted: the scale stays
          slider.lastY = null;
          slider.cooldownUntil = now + SLIDER_COOLDOWN_MS;
          placeTick();
        }
        holdMarker.material.opacity = 0;
        return;
      }

      // Not grabbed: is a fingertip resting steadily on one spot?
      if (fingerY !== null && (slider.holdY === null || Math.abs(fingerY - slider.holdY) > 0.5)) {
        slider.holdY = fingerY;
        slider.holdStart = now;
        slider.holdReads = 0;
        slider.holdHits = 0;
      }
      if (slider.holdY !== null) {
        slider.holdReads++;
        if (fingerY !== null && Math.abs(fingerY - slider.holdY) <= 0.5) slider.holdHits++;
        if (now - slider.lastSeen > 250) { slider.holdY = null; }
      }

      let progress = 0;
      if (slider.holdY !== null) {
        progress = (now - slider.holdStart) / HOLD_MS;
        if (progress >= 1) {
          if (slider.holdHits / Math.max(1, slider.holdReads) >= HOLD_STEADINESS) {
            slider.grabbed = true;
            slider.lastY = slider.holdY;
            setScaleT(yToScaleT(slider.holdY));
          }
          slider.holdY = null;
          progress = 0;
        }
      }

      if (slider.holdY !== null && progress > 0) {
        const p = cmToPage(SLIDER_CM.x, slider.holdY);
        holdMarker.position.set(p.x, p.y, 0.0025);
        holdMarker.material.opacity = Math.min(progress, 1);
      } else {
        holdMarker.material.opacity = 0;
      }
    }

    // ============================================================
    // SCREEN TOUCH (backup) -> a point on the paper
    // ============================================================
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const inverseMatrix = new THREE.Matrix4();
    const localRay = new THREE.Ray();
    const paperPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const hitPoint = new THREE.Vector3();

    function screenToPaperCm(clientX, clientY, renderer, camera, anchorGroup) {
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      anchorGroup.updateMatrixWorld(true);
      inverseMatrix.copy(anchorGroup.matrixWorld).invert();
      localRay.copy(raycaster.ray).applyMatrix4(inverseMatrix);
      if (!localRay.intersectPlane(paperPlane, hitPoint)) return null;
      return pageToCm(hitPoint.x, hitPoint.y);
    }

    // ============================================================
    // START
    // ============================================================
    async function startAR() {
      document.getElementById('start').style.display = 'none';
      statusEl.style.display = SHOW_STATUS ? 'block' : 'none';
      statusEl.textContent = 'Loading the archive…';

      const gpsPromise = (CENTER_MODE === 'gps') ? getGpsPosition() : Promise.resolve(null);

      try {
        await treesReady;
        if (!editions.length) dataProblem = 'No trees with an edition yet';
      } catch (err) {
        console.error(err);
        dataProblem = 'Could not read the archive: ' + err.message;
      }

      if (CENTER_MODE === 'nearFirstTree' && trees.length) {
        const t = trees[0];
        center = {
          lat: t.latitude - 20 / 111320,
          lon: t.longitude - 10 / (111320 * Math.cos(t.latitude * DEG)),
          source: 'test centre near "' + t.title + '"'
        };
      } else {
        const gps = await gpsPromise;
        center = gps
          ? { lat: gps.lat, lon: gps.lon, source: 'GPS ±' + Math.round(gps.accuracy) + ' m' }
          : { lat: POINT_NEMO.lat, lon: POINT_NEMO.lon, source: 'Point Nemo (no location)' };
      }

      const mindarThree = new MindARThree({
        container: document.getElementById('ar'),
        imageTargetSrc: './targets.mind',
        uiScanning: 'no',
        uiLoading: 'yes',
        filterMinCF: TRACK_FILTER_MIN_CF,
        filterBeta: TRACK_FILTER_BETA,
        warmupTolerance: TRACK_WARMUP_FRAMES,
        missTolerance: TRACK_MISS_FRAMES
      });
      const { renderer, scene, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);    // exact tracked page (used by the eye)

      // Everything visible lives in a smoothed copy of the page, which glides towards the tracked one
      const display = new THREE.Group();
      display.matrixAutoUpdate = false;
      display.visible = false;
      scene.add(display);
      const smoothPos = new THREE.Vector3(), smoothQuat = new THREE.Quaternion(), smoothScale = new THREE.Vector3();
      const targetPos = new THREE.Vector3(), targetQuat = new THREE.Quaternion(), targetScale = new THREE.Vector3();
      let smoothReady = false;

      editionGroup = new THREE.Group(); display.add(editionGroup);
      treeGroup    = new THREE.Group(); display.add(treeGroup);

      tickMesh = new THREE.Mesh(new THREE.PlaneGeometry(cmToUnits(0.6), cmToUnits(0.1)), new THREE.MeshBasicMaterial({ color: GREEN }));
      display.add(tickMesh);
      holdMarker = new THREE.Mesh(
        new THREE.PlaneGeometry(cmToUnits(0.6), cmToUnits(0.1)),
        new THREE.MeshBasicMaterial({ color: GREEN, transparent: true, opacity: 0 })
      );
      display.add(holdMarker);

      if (SHOW_DEBUG_OUTLINE) {
        const tl = cmToPage(BLANK_AREA_CM.left, BLANK_AREA_CM.top);
        const tr = cmToPage(BLANK_AREA_CM.right, BLANK_AREA_CM.top);
        const br = cmToPage(BLANK_AREA_CM.right, BLANK_AREA_CM.bottom);
        const bl = cmToPage(BLANK_AREA_CM.left, BLANK_AREA_CM.bottom);
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(tl.x, tl.y, 0.001), new THREE.Vector3(tr.x, tr.y, 0.001),
          new THREE.Vector3(br.x, br.y, 0.001), new THREE.Vector3(bl.x, bl.y, 0.001)
        ]);
        display.add(new THREE.LineLoop(geometry, new THREE.LineBasicMaterial({ color: GREEN })));
      }

      buildEditionRow();
      placeTick();
      buildTreeDots();
      const samples = allSamples();

      anchor.onTargetFound = () => { mapFound = true;  refreshStatus(); };
      anchor.onTargetLost  = () => { mapFound = false; smoothReady = false; refreshStatus(); };
      refreshStatus();

      // ---------- Screen backup: tap editions, drag the scale ----------
      const arEl = document.getElementById('ar');
      arEl.addEventListener('pointerdown', (e) => {
        if (!mapFound) return;
        const paper = screenToPaperCm(e.clientX, e.clientY, renderer, camera, anchor.group);
        if (!paper) return;
        if (Math.abs(paper.x - SLIDER_CM.x) <= SLIDER_TOUCH_CM &&
            paper.y >= SLIDER_CM.topY - 0.5 && paper.y <= SLIDER_CM.bottomY + 0.5) {
          slider.grabbed = true; slider.viaScreen = true;
          arEl.setPointerCapture(e.pointerId);
          setScaleT(yToScaleT(paper.y)); refreshStatus();
          return;
        }
        for (const c of visibleEditionCircles()) {
          if (Math.hypot(paper.x - c.x, paper.y - c.y) <= EDITION_TOUCH_CM) { chooseEditionCircle(c); return; }
        }
      });
      arEl.addEventListener('pointermove', (e) => {
        if (!slider.viaScreen || !mapFound) return;
        const paper = screenToPaperCm(e.clientX, e.clientY, renderer, camera, anchor.group);
        if (paper) { setScaleT(yToScaleT(paper.y)); refreshStatus(); }
      });
      const release = () => {
        if (slider.viaScreen) {
          slider.viaScreen = false; slider.grabbed = false;
          slider.cooldownUntil = performance.now() + SLIDER_COOLDOWN_MS;
          placeTick(); refreshStatus();
        }
      };
      arEl.addEventListener('pointerup', release);
      arEl.addEventListener('pointercancel', release);

      await mindarThree.start();
      const video = mindarThree.video;

      let lastEye = 0;
      renderer.setAnimationLoop(() => {
        // Glide the visible page towards the tracked page
        if (mapFound) {
          anchor.group.updateMatrixWorld(true);
          anchor.group.matrixWorld.decompose(targetPos, targetQuat, targetScale);
          if (!smoothReady) {
            smoothPos.copy(targetPos); smoothQuat.copy(targetQuat); smoothScale.copy(targetScale);
            smoothReady = true;
          } else {
            smoothPos.lerp(targetPos, DISPLAY_SMOOTHING);
            smoothQuat.slerp(targetQuat, DISPLAY_SMOOTHING);
            smoothScale.lerp(targetScale, DISPLAY_SMOOTHING);
          }
          display.matrix.compose(smoothPos, smoothQuat, smoothScale);
          display.matrixWorldNeedsUpdate = true;
          display.visible = true;
        } else {
          display.visible = false;
        }

        renderer.render(scene, camera);

        // Read the paper ten times a second
        const now = performance.now();
        if (!mapFound || now - lastEye < EYE_TICK_MS) return;
        lastEye = now;
        if (!captureFrame(video)) return;

        view = {
          anchorGroup: anchor.group,
          camera,
          canvasRect: renderer.domElement.getBoundingClientRect(),
          videoRect: video.getBoundingClientRect()
        };
        readSamples(samples);
        updateEditions(now);
        updateSlider(now);
        if (selectedEdition !== null) updateLines();
        refreshStatus();
      });
    }

    document.getElementById('start').addEventListener('click', startAR, { once: true });
  </script>
</body>
</html>
